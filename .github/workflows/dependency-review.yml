name: Dependency Review
on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # TEMPORARY — remove once the advisory range is re-cut upstream.
          #
          # GHSA-mh99-v99m-4gvg (CVE-2026-14257), brace-expansion OOM DoS. The
          # advisory declares a flat "<=5.0.7", filed 2026-07-23 when 5.0.8 was
          # the only patched release. Backports landed on 2026-07-28 (2.1.3,
          # 3.0.5) but the range was never split, so patched 2.x still matches
          # it. We pin every copy to 2.1.3 via the brace-expansion overrides in
          # package.json; 2.1.3 carries the EXPANSION_MAX_LENGTH fix, verified
          # against the PoC input.
          #
          # We cannot move to 5.0.8 instead: it is named-export-only
          # ({ expand }, not callable), which breaks minimatch 3/5/9, and the
          # minimatch releases built for it (10.0.3+) drop the callable CJS
          # export that glob@7 and serve-handler require.
          #
          # Recheck after 2026-08: if the advisory now excludes >=2.1.3, delete
          # this allowlist. Verify with `npm audit` before removing.
          allow-ghsas: GHSA-mh99-v99m-4gvg
