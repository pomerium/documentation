name: pre-commit

on:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      # Without this, Node's bundled (disabled) corepack shim for `yarn`
      # refuses to run at all once package.json declares a "packageManager"
      # field, even though that field only pins npm. postman-code-generators
      # (a transitive dep of docusaurus-theme-openapi-docs) shells out to
      # `yarn install` from its postinstall script, so npm ci fails without
      # this enabled.
      - run: corepack enable

      - name: Install npm 11.12.1 (npm 10 ignores min-release-age)
        run: |
          npm_dir="$(npm root -g)/npm"
          rm -rf "$npm_dir"
          mkdir -p "$npm_dir"
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-11.12.1.tgz" | tar xz --strip-components=1 -C "$npm_dir"
      - name: Verify npm version
        run: npm --version

      # CI validates the repo scripts directly so formatting and spelling
      # always use the repo-root toolchain and config.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run cspell
      - run: npm run test:reference-links
      - run: npm run guide-audit
      - run: npm run test:robots
