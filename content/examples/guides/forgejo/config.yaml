# Pomerium Core configuration for Forgejo. The OIDC bridge needs a self-hosted
# authenticate service, so set this to a domain you control. Hosted authenticate
# domains don't serve the bridge.
authenticate_service_url: https://authenticate.yourdomain.com

# Your identity provider. See the Keycloak guide for an example:
# https://www.pomerium.com/docs/integrations/user-identity/oidc
idp_provider: oidc
idp_provider_url: https://keycloak.yourdomain.com/realms/pomerium
idp_client_id: REPLACE_WITH_CLIENT_ID
idp_client_secret: REPLACE_WITH_CLIENT_SECRET

# Obtain TLS certificates automatically from Let's Encrypt.
autocert: true

# Signs and encrypts the OIDC tokens Pomerium issues to Forgejo. Generate your own
# and keep it secret. Keep the same value across restarts:
#   openssl rand -base64 32
shared_secret: REPLACE_WITH_BASE64_32_BYTE_SECRET

routes:
  # Forgejo has no setting to skip its login page when there's only one login
  # source, so send /user/login straight to the "pomerium" source's sign-in URL.
  # Must come before the main Forgejo route.
  - from: https://forgejo.yourdomain.com
    path: /user/login
    redirect:
      path_redirect: /user/oauth2/pomerium
    policy:
      - allow:
          or:
            - email:
                # Keep in sync with the main route's policy
                is: you@example.com

  - from: https://forgejo.yourdomain.com
    to: http://forgejo:3000
    # Makes Pomerium the OpenID Connect provider for this route. Forgejo doesn't
    # use PKCE, so it's a confidential client: enter the same value as the client
    # secret when you add the login source in Forgejo. Generate your own:
    #   openssl rand -base64 32
    oidc_bridge:
      client_secret: REPLACE_WITH_ROUTE_CLIENT_SECRET
    # Git transfers can be large and long-running; don't cap total request time.
    timeout: 0s
    idle_timeout: 600s
    policy:
      - allow:
          or:
            - email:
                # Replace with the users or domain you want to allow
                is: you@example.com
