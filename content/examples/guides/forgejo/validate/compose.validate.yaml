# Sealed E2E validation for the Forgejo guide. Reuses the shared harness (Keycloak +
# certs + headless runner) and adds Forgejo + a Pomerium wired to the in-network IdP.
# Run with: scripts/validate-guide-fixtures.sh forgejo
#
# Forgejo sits ONLY on the
# internal-only `forgejo-internal` network, shared with pomerium alone. The
# test-runner is on `default`, so it cannot reach forgejo directly (the spec proves
# this); the only path in is through Pomerium, which bridges both networks.

include:
  - ../../_harness/compose/compose.harness.yaml

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.2@sha256:db04c7114b656f896e206ba3873fe8d3a7adf2daa44907037f0274f4ba653fb9
    environment:
      FORGEJO__server__ROOT_URL: 'https://forgejo.localhost.pomerium.io/'
      FORGEJO__database__DB_TYPE: 'sqlite3'
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: 'true'

      # OIDC login through Pomerium's bridge, exactly as the published guide ships.
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: 'true'
      FORGEJO__oauth2_client__USERNAME: 'email'
      FORGEJO__oauth2_client__ACCOUNT_LINKING: 'auto'
      FORGEJO__service__DISABLE_REGISTRATION: 'false'
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: 'true'
      FORGEJO__service__SHOW_REGISTRATION_BUTTON: 'false'
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: 'false'
      # Trust the harness CA so Forgejo can fetch Pomerium's OIDC discovery over TLS.
      # Validation-only.
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - forgejo-data:/data
      - certs:/certs:ro
    networks:
      forgejo-internal:
        aliases:
          - forgejo

  pomerium:
    image: pomerium/pomerium:v0.34.0@sha256:TODO
    command: ['--config', '/pomerium/config.yaml']
    env_file:
      - ../../_harness/pomerium/validation.env
    volumes:
      - certs:/certs:ro
      - ./routes.validate.yaml:/pomerium/config.yaml:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      forgejo:
        condition: service_started
    networks:
      # On `default` for the IdP + test-runner, and on the internal-only network
      # to reach forgejo. This is the only service bridging the two.
      default:
        aliases:
          - authenticate.localhost.pomerium.io
          - forgejo.localhost.pomerium.io
      forgejo-internal: {}
    healthcheck:
      test: ['CMD', 'pomerium', 'health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Registers Pomerium as Forgejo's login source, mirroring the guide's
  # `forgejo admin auth add-oauth` step. Needs Pomerium up to fetch the discovery
  # document, and Forgejo's database ready.
  forgejo-setup:
    image: codeberg.org/forgejo/forgejo:15.0.2@sha256:db04c7114b656f896e206ba3873fe8d3a7adf2daa44907037f0274f4ba653fb9
    user: git
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until forgejo admin auth list >/dev/null 2>&1; do sleep 2; done
        forgejo admin auth add-oauth --name pomerium --provider openidConnect \
          --key https://forgejo.localhost.pomerium.io \
          --secret forgejo-e2e-client-secret \
          --auto-discover-url https://authenticate.localhost.pomerium.io/.well-known/openid-configuration
    environment:
      FORGEJO__database__DB_TYPE: 'sqlite3'
      FORGEJO__security__INSTALL_LOCK: 'true'
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - forgejo-data:/data
      - certs:/certs:ro
    depends_on:
      pomerium:
        condition: service_healthy
    networks:
      - forgejo-internal
      - default
    restart: 'no'

networks:
  # Internal-only: no route to the outside, and the test-runner is not attached,
  # so forgejo is reachable only via Pomerium.
  forgejo-internal:
    internal: true

volumes:
  forgejo-data:
