# Routes-only validation config. Shared settings (IdP, secrets, certs) come from
# ../../_harness/pomerium/validation.env via env_file in compose.validate.yaml.
routes:
  - from: https://jenkins.localhost.pomerium.io
    to: http://jenkins:8080
    # Test-only secret. It matches clientSecret in jenkins.casc.yaml.
    oidc_bridge:
      client_secret: test-only-jenkins-client-secret
    policy:
      - allow:
          or:
            - authenticated_user: true
