# Validation-only Jenkins Configuration as Code (JCasC). Drives the OpenID Connect
# plugin headlessly so the sealed fixture can prove that Jenkins signs users in
# through Pomerium's OIDC bridge. The published guide configures the same plugin
# through the Jenkins UI (see ../../../docs/guides/jenkins.mdx).
# Test-only. Never reuse this configuration verbatim in production.
jenkins:
  securityRealm:
    oic:
      clientId: https://jenkins.localhost.pomerium.io
      # Matches the route's oidc_bridge client_secret in routes.validate.yaml.
      clientSecret: test-only-jenkins-client-secret
      serverConfiguration:
        wellKnown:
          wellKnownOpenIDConfigurationUrl: https://authenticate.localhost.pomerium.io/.well-known/openid-configuration
      userNameField: email
      emailFieldName: email
      fullNameFieldName: name
      properties:
        - pkce
  # Any signed-in user can do anything; Pomerium policy is the real access gate.
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
