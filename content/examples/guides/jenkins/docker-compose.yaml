services:
  pomerium:
    image: pomerium/pomerium:main@sha256:07574b2040dac563f729198f19080492b14d9eaa2424f5719863505fe4999ea7
    volumes:
      - ./config.yaml:/pomerium/config.yaml:ro
      - pomerium-cache:/data
    ports:
      - 443:443
      - 80:80
    restart: always

  jenkins:
    image: jenkins/jenkins:2.555.2-lts@sha256:01c992ffef29dcf41c7164e8c16285c657c2368c4943dda8d68c93fdf54447d5
    # Jenkins is reached only through Pomerium, so no host ports are published.
    # 8080 stays on the internal Docker network. You complete the first-run
    # setup wizard and install the OpenID Connect plugin through the browser, as
    # the guide describes.
    volumes:
      - jenkins-home:/var/jenkins_home
    restart: always

volumes:
  pomerium-cache:
  jenkins-home:
