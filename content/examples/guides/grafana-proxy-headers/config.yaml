# Pomerium Core configuration for Grafana. Uses the hosted authenticate service, so
# you don't run your own identity provider. To self-host the IdP, see the Keycloak
# guide: https://www.pomerium.com/docs/integrations/user-identity/oidc
authenticate_service_url: https://authenticate.pomerium.app

# Obtain TLS certificates automatically from Let's Encrypt.
autocert: true

# Encrypts Pomerium's session cookies. Keep the same value across restarts, or
# every user has to sign in again after Pomerium restarts:
#   openssl rand -base64 32
cookie_secret: REPLACE_WITH_BASE64_32_BYTE_COOKIE_SECRET

# Signs the identity JWT Pomerium forwards to Grafana. Pomerium publishes the
# public key at the route's /.well-known/pomerium/jwks.json, where Grafana fetches
# it to verify the JWT. Generate your own and keep it secret:
#   openssl ecparam -genkey -name prime256v1 -noout | base64 | tr -d '\n'
signing_key: REPLACE_WITH_BASE64_ENCODED_EC_P256_PRIVATE_KEY

routes:
  - from: https://grafana.yourdomain.com
    to: http://grafana:3000
    # Forward the signed X-Pomerium-Jwt-Assertion header to Grafana.
    pass_identity_headers: true
    # Grafana Live streams dashboard updates over a websocket.
    allow_websockets: true
    policy:
      - allow:
          or:
            - email:
                # Replace with the users or domain you want to allow
                is: you@example.com
