# Sealed E2E validation for the Gitea guide. Reuses the shared harness (Keycloak +
# certs + headless runner) and adds Gitea + a Pomerium wired to the in-network IdP.
# Run with: scripts/validate-guide-fixtures.sh gitea
#
# Gitea sits ONLY on the
# internal-only `gitea-internal` network, shared with pomerium alone. The
# test-runner is on `default`, so it cannot reach gitea directly (the spec proves
# this); the only path in is through Pomerium, which bridges both networks.

include:
  - ../../_harness/compose/compose.harness.yaml

services:
  gitea:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    environment:
      GITEA__server__ROOT_URL: "https://gitea.localhost.pomerium.io/"
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__server__LANDING_PAGE: "login"

      # OIDC login through Pomerium's bridge, exactly as the published guide ships.
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: "email"
      GITEA__oauth2_client__ACCOUNT_LINKING: "login"
      # No-op here: gitea-internal has no outbound access, and Gitea ignores
      # avatar download errors. Kept to match the guide.
      GITEA__oauth2_client__UPDATE_AVATAR: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
      GITEA__service__ENABLE_PASSKEY_AUTHENTICATION: "false"
      # Trust the harness CA so Gitea can fetch Pomerium's OIDC discovery over TLS.
      # Validation-only.
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - gitea-data:/data
      - certs:/certs:ro
    networks:
      gitea-internal:
        aliases:
          - gitea

  pomerium:
    # TODO: switch to the pomerium/pomerium v0.35.0 release image (pinned by digest)
    # once it ships. Until then this uses the unreleased OIDC bridge build from
    # gcp-demo: docker load < pomerium-oidc-bridge-7f192990.image.tar.gz
    image: local/pomerium:oidc-bridge-7f192990
    command: ["--config", "/pomerium/config.yaml"]
    env_file:
      - ../../_harness/pomerium/validation.env
    volumes:
      - certs:/certs:ro
      - ./routes.validate.yaml:/pomerium/config.yaml:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      gitea:
        condition: service_started
    networks:
      # On `default` for the IdP + test-runner, and on the internal-only network
      # to reach gitea. This is the only service bridging the two.
      default:
        aliases:
          - authenticate.localhost.pomerium.io
          - gitea.localhost.pomerium.io
      # The alias lets Gitea reach the authenticate service for OIDC discovery
      # over the internal network, which has no route to the outside world.
      gitea-internal:
        aliases:
          - authenticate.localhost.pomerium.io
    healthcheck:
      test: ["CMD", "pomerium", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Registers Pomerium as Gitea's login source, mirroring the guide's
  # `gitea admin auth add-oauth` step. Needs Pomerium up to fetch the discovery
  # document, and Gitea's database ready.
  gitea-setup:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    user: git
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until gitea admin auth list >/dev/null 2>&1; do sleep 2; done
        gitea admin auth add-oauth --name pomerium --provider openidConnect \
          --key https://gitea.localhost.pomerium.io \
          --secret gitea-e2e-client-secret \
          --auto-discover-url https://authenticate.localhost.pomerium.io/.well-known/openid-configuration
        # Stay running and report healthy once registered: `up --wait` treats a
        # setup container that has exited as a failed service.
        touch /tmp/setup-done
        exec sleep infinity
    environment:
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__security__INSTALL_LOCK: "true"
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - gitea-data:/data
      - certs:/certs:ro
    depends_on:
      pomerium:
        condition: service_healthy
    networks:
      - gitea-internal
      - default
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/setup-done"]
      interval: 2s
      retries: 60
    restart: "no"

networks:
  # Internal-only: no route to the outside, and the test-runner is not attached,
  # so gitea is reachable only via Pomerium.
  gitea-internal:
    internal: true

volumes:
  gitea-data:
