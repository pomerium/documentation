# Sealed validation for the GitLab guide. Reuses the shared harness (Keycloak +
# certs + headless runner) and adds GitLab + a Pomerium wired to the in-network IdP.
# Run with: scripts/validate-guide-fixtures.sh gitlab
#
# This is a real end-to-end test: it proves Pomerium gates the route, then GitLab
# completes its OpenID Connect login against Pomerium's OIDC bridge and GitLab's own
# API (/api/v4/user) confirms the session belongs to the Pomerium identity.
#
# GitLab is heavy and slow to boot (several minutes, multiple GB RAM), so its
# healthcheck uses a very generous start_period; Pomerium waits for it to report
# healthy before the browser checks run.

include:
  - ../../_harness/compose/compose.harness.yaml

services:
  gitlab:
    image: gitlab/gitlab-ce:19.0.1-ce.0@sha256:c7082004a0f64123634fda345e849453d52956621893bed7d2218fa6f088247f
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.localhost.pomerium.io'
        letsencrypt['enable'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false

        # OIDC login through Pomerium's bridge, as the published guide ships it.
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_auto_sign_in_with_provider'] = 'openid_connect'
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'Pomerium',
            args: {
              name: 'openid_connect',
              # TODO: restore ['openid', 'profile', 'email'] (as in the guide) once the released
              # bridge accepts multiple scopes. The v0.35.0 pre-release build rejects them.
              scope: ['openid'],
              response_type: 'code',
              issuer: 'https://authenticate.localhost.pomerium.io',
              discovery: true,
              client_auth_method: 'query',
              pkce: true,
              client_options: {
                identifier: 'https://gitlab.localhost.pomerium.io',
                secret: 'unused',
                redirect_uri: 'https://gitlab.localhost.pomerium.io/users/auth/openid_connect/callback'
              }
            }
          }
        ]
    shm_size: '256m'
    volumes:
      # Trust the harness CA so GitLab can fetch Pomerium's OIDC discovery over TLS.
      # GitLab's bundled Ruby ignores SSL_CERT_FILE, so use its trusted-certs
      # directory, which it reads when it starts and needs to write to. Validation-only.
      - certs:/etc/gitlab/trusted-certs
    depends_on:
      certs-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - gitlab
    healthcheck:
      test: ['CMD', '/opt/gitlab/bin/gitlab-healthcheck', '--fail', '--max-time', '10']
      interval: 15s
      timeout: 15s
      retries: 80
      start_period: 600s

  pomerium:
    image: pomerium/pomerium:main@sha256:07574b2040dac563f729198f19080492b14d9eaa2424f5719863505fe4999ea7
    command: ['--config', '/pomerium/config.yaml']
    env_file:
      - ../../_harness/pomerium/validation.env
    volumes:
      - certs:/certs:ro
      - ./routes.validate.yaml:/pomerium/config.yaml:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    networks:
      default:
        aliases:
          - authenticate.localhost.pomerium.io
          - gitlab.localhost.pomerium.io
    healthcheck:
      test: ['CMD', 'pomerium', 'health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
