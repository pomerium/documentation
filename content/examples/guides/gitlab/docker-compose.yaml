services:
  pomerium:
    image: pomerium/pomerium:main@sha256:07574b2040dac563f729198f19080492b14d9eaa2424f5719863505fe4999ea7
    volumes:
      - ./config.yaml:/pomerium/config.yaml:ro
      - pomerium-cache:/data
    ports:
      - 443:443
      - 80:80
    # GitLab calls the authenticate service from inside its container for OIDC
    # discovery and the token exchange. The alias lets it reach Pomerium over the
    # Compose network instead of going out to the public internet and back.
    networks:
      default:
        aliases:
          - authenticate.yourdomain.com
    restart: always

  gitlab:
    image: gitlab/gitlab-ce:19.0.1-ce.0@sha256:c7082004a0f64123634fda345e849453d52956621893bed7d2218fa6f088247f
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.yourdomain.com'
        letsencrypt['enable'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false

        # Create accounts on first sign-in through Pomerium, and activate them
        # immediately. Pomerium's route policy decides who can get this far.
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        # Skip GitLab's sign-in page. For the local root login, browse to
        # /users/sign_in?auto_sign_in=false
        gitlab_rails['omniauth_auto_sign_in_with_provider'] = 'openid_connect'
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'Pomerium',
            args: {
              name: 'openid_connect',
              scope: ['openid', 'profile', 'email'],
              response_type: 'code',
              # Your authenticate_service_url, exactly as set in config.yaml.
              issuer: 'https://authenticate.yourdomain.com',
              discovery: true,
              # Send the client ID in the request body, not in an HTTP Basic header.
              client_auth_method: 'query',
              pkce: true,
              client_options: {
                # Must match the route's `from` URL.
                identifier: 'https://gitlab.yourdomain.com',
                # GitLab requires a value here. The bridge ignores it for a PKCE client.
                secret: 'unused',
                redirect_uri: 'https://gitlab.yourdomain.com/users/auth/openid_connect/callback'
              }
            }
          }
        ]
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: '256m'
    restart: always

volumes:
  pomerium-cache:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
