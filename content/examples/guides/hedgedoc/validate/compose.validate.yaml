# Sealed E2E validation for the HedgeDoc guide. Reuses the shared harness (Keycloak +
# certs + headless runner) and adds HedgeDoc + its Postgres database plus a Pomerium
# wired to the in-network IdP. HedgeDoc logs in through Pomerium's OIDC bridge.
# Run with: scripts/validate-guide-fixtures.sh hedgedoc

include:
  - ../../_harness/compose/compose.harness.yaml

services:
  database:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hedgedoc
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hedgedoc -d hedgedoc']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      internal:
        aliases:
          - database

  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.10.8@sha256:abdb6b08815d5bc5832b52d983d983ac678895e9fa0d76aaad80d08c5d70812b
    environment:
      CMD_DB_URL: postgres://hedgedoc:password@database:5432/hedgedoc
      CMD_DOMAIN: hedgedoc.localhost.pomerium.io
      CMD_PROTOCOL_USESSL: 'true'
      CMD_URL_ADDPORT: 'false'
      CMD_SESSION_SECRET: test-only-session-secret-do-not-reuse
      CMD_OAUTH2_PROVIDERNAME: Pomerium
      CMD_OAUTH2_CLIENT_ID: https://hedgedoc.localhost.pomerium.io
      CMD_OAUTH2_PKCE: 'true'
      CMD_OAUTH2_SCOPE: openid email profile
      CMD_OAUTH2_AUTHORIZATION_URL: https://authenticate.localhost.pomerium.io/oidc/auth
      CMD_OAUTH2_TOKEN_URL: https://authenticate.localhost.pomerium.io/oidc/token
      CMD_OAUTH2_USER_PROFILE_URL: https://authenticate.localhost.pomerium.io/oidc/userinfo
      CMD_OAUTH2_USER_PROFILE_ID_ATTR: sub
      CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: email
      CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: name
      CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: email
      CMD_ALLOW_ANONYMOUS: 'false'
      CMD_EMAIL: 'false'
      CMD_ALLOW_EMAIL_REGISTER: 'false'
      # Trust the harness CA so HedgeDoc can call Pomerium's OIDC endpoints over TLS.
      # Validation-only; the published guide uses a public certificate.
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - certs:/certs:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/\",r=>process.exit(r.statusCode<500?0:1)).on(\"error\",()=>process.exit(1))'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 90s
    # HedgeDoc and its database live ONLY on the internal network shared with
    # Pomerium, so the test-runner cannot reach hedgedoc:3000 directly.
    networks:
      internal:
        aliases:
          - hedgedoc

  pomerium:
    image: pomerium/pomerium:v0.34.0@sha256:TODO
    command: ['--config', '/pomerium/config.yaml']
    env_file:
      - ../../_harness/pomerium/validation.env
    volumes:
      - certs:/certs:ro
      - ./routes.validate.yaml:/pomerium/config.yaml:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      hedgedoc:
        condition: service_healthy
    # Pomerium straddles both networks: `default` so the runner and Keycloak can
    # reach it, `internal` so it alone can route to HedgeDoc and so HedgeDoc can reach
    # the authenticate service.
    networks:
      default:
        aliases:
          - authenticate.localhost.pomerium.io
          - hedgedoc.localhost.pomerium.io
      internal:
        aliases:
          - authenticate.localhost.pomerium.io
    healthcheck:
      test: ['CMD', 'pomerium', 'health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  # internal: true means no gateway to the host/outside; only services explicitly
  # attached (hedgedoc, database + pomerium) can talk on it.
  internal:
    internal: true
