services:
  pomerium:
    image: pomerium/pomerium:main@sha256:07574b2040dac563f729198f19080492b14d9eaa2424f5719863505fe4999ea7
    volumes:
      - ./config.yaml:/pomerium/config.yaml:ro
      - pomerium-cache:/data
    ports:
      - 443:443
      - 80:80
    # Pomerium is the only service on the default network (where its ports are
    # published) and is also on the internal network so it can reach HedgeDoc.
    # The alias lets HedgeDoc reach the authenticate service over the internal
    # network, because that network has no route to the outside world.
    networks:
      default: {}
      internal:
        aliases:
          - authenticate.yourdomain.com
    restart: always

  hedgedoc:
    # Check https://hedgedoc.org/latest-release for the current stable release.
    image: quay.io/hedgedoc/hedgedoc:1.10.8@sha256:abdb6b08815d5bc5832b52d983d983ac678895e9fa0d76aaad80d08c5d70812b
    environment:
      - CMD_DB_URL=postgres://hedgedoc:password@database:5432/hedgedoc
      - CMD_DOMAIN=hedgedoc.yourdomain.com
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      # Replace this with your own value: head -c32 /dev/urandom | base64
      - CMD_SESSION_SECRET=replace-with-a-random-session-secret
      # Pomerium's OIDC bridge as HedgeDoc's OAuth2 login. HedgeDoc has no
      # discovery, so each endpoint is set explicitly. Replace the host with your
      # authenticate service, set as authenticate_service_url in config.yaml.
      - CMD_OAUTH2_PROVIDERNAME=Pomerium
      # Must match the route's `from` URL.
      - CMD_OAUTH2_CLIENT_ID=https://hedgedoc.yourdomain.com
      # PKCE authenticates the token request, so the route has no client secret.
      - CMD_OAUTH2_PKCE=true
      # HedgeDoc only turns on OAuth2 login when a client secret is set, even with
      # PKCE. Any non-empty value works; Pomerium doesn't check it on this route.
      - CMD_OAUTH2_CLIENT_SECRET=unused
      - CMD_OAUTH2_SCOPE=openid email profile
      - CMD_OAUTH2_AUTHORIZATION_URL=https://authenticate.yourdomain.com/oidc/auth
      - CMD_OAUTH2_TOKEN_URL=https://authenticate.yourdomain.com/oidc/token
      - CMD_OAUTH2_USER_PROFILE_URL=https://authenticate.yourdomain.com/oidc/userinfo
      # Map the userinfo claims to the HedgeDoc account.
      - CMD_OAUTH2_USER_PROFILE_ID_ATTR=sub
      - CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR=email
      - CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR=name
      - CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR=email
      # Make Pomerium the only way to sign in: no guest access, no local accounts.
      - CMD_ALLOW_ANONYMOUS=false
      - CMD_EMAIL=false
      - CMD_ALLOW_EMAIL_REGISTER=false
    volumes:
      - hedgedoc-uploads:/hedgedoc/public/uploads
      # Optional: skip HedgeDoc's Sign In button. See "Skip the Sign In button"
      # in the guide before you turn this on.
      # - ./header.ejs:/hedgedoc/public/views/index/header.ejs:ro
    # HedgeDoc is only on the internal network, so Pomerium is the only way in.
    networks:
      internal: {}
    restart: always
    depends_on:
      - database

  database:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      - POSTGRES_USER=hedgedoc
      # Change this before running anything beyond a local demo.
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hedgedoc
    volumes:
      - hedgedoc-database:/var/lib/postgresql/data
    networks:
      internal: {}
    restart: always

networks:
  # No gateway to the host or the outside, so only Pomerium (which also sits on the
  # default network) can reach HedgeDoc. Pomerium's alias is how HedgeDoc reaches
  # the authenticate service from here.
  internal:
    internal: true

volumes:
  pomerium-cache:
  hedgedoc-uploads:
  hedgedoc-database:
