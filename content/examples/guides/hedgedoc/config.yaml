# Pomerium Core configuration for HedgeDoc. The OIDC bridge needs a self-hosted
# authenticate service, so set this to a domain you control. Hosted authenticate
# domains don't serve the bridge.
authenticate_service_url: https://authenticate.yourdomain.com

# Pomerium's hosted identity provider signs users in with email and password,
# Google, or GitHub. To use your own identity provider instead, replace this
# line with idp_provider, idp_provider_url, idp_client_id and idp_client_secret.
idp_provider: hosted

# Obtain TLS certificates automatically from Let's Encrypt.
autocert: true

# Signs and encrypts the OIDC tokens Pomerium issues to HedgeDoc. Generate your own
# and keep it secret. Keep the same value across restarts:
#   openssl rand -base64 32
shared_secret: REPLACE_WITH_BASE64_32_BYTE_SECRET

routes:
  # HedgeDoc's Sign Out ends only its own session and returns to its home page.
  # This route still sends /logout to HedgeDoc, so HedgeDoc clears its session,
  # then replaces the redirect so the browser continues to Pomerium's sign-out.
  # It must come before the main route, because Pomerium matches routes in order.
  - from: https://hedgedoc.yourdomain.com
    path: /logout
    to: http://hedgedoc:3000
    set_response_headers:
      Location: https://hedgedoc.yourdomain.com/.pomerium/sign_out
    policy:
      - allow:
          or:
            - email:
                is: you@example.com

  - from: https://hedgedoc.yourdomain.com
    to: http://hedgedoc:3000
    # Makes Pomerium the OpenID Connect provider for this route. HedgeDoc uses
    # PKCE, so no client_secret is needed on the route.
    oidc_bridge: {}
    # HedgeDoc's collaborative editor keeps a live connection open, so the route
    # has to allow WebSocket upgrades.
    allow_websockets: true
    policy:
      - allow:
          or:
            - email:
                is: you@example.com
