services:
  pomerium:
    image: pomerium/pomerium:v0.34.0@sha256:TODO
    volumes:
      - ./config.yaml:/pomerium/config.yaml:ro
      - pomerium-cache:/data
    ports:
      - 443:443
      - 80:80
    # Pomerium is the only service on the default network (where its ports are
    # published) and is also on the internal network so it can reach Open WebUI.
    # The alias lets Open WebUI reach the authenticate service over the internal
    # network, because that network has no route to the outside world.
    networks:
      default: {}
      internal:
        aliases:
          - authenticate.yourdomain.com
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:7f1b0a1a50cfbac23da3b16f96bc968fd757b26dc9e54e93813d61768ea9184e
    environment:
      # Open WebUI's public URL.
      - WEBUI_URL=https://llm.yourdomain.com
      - OAUTH_PROVIDER_NAME=Pomerium
      # Must match the route's `from` URL.
      - OAUTH_CLIENT_ID=https://llm.yourdomain.com
      # Use PKCE (S256), so no client secret is needed.
      - OAUTH_CODE_CHALLENGE_METHOD=S256
      # Send the client ID in the token request body, not an HTTP Basic header.
      - OAUTH_TOKEN_ENDPOINT_AUTH_METHOD=client_secret_post
      - OAUTH_SCOPES=openid email profile
      # Your authenticate service, set as authenticate_service_url in config.yaml.
      - OPENID_PROVIDER_URL=https://authenticate.yourdomain.com/.well-known/openid-configuration
      - OPENID_REDIRECT_URI=https://llm.yourdomain.com/oauth/oidc/callback
      # Create the Open WebUI account on first sign-in.
      - ENABLE_OAUTH_SIGNUP=true
      # Make Pomerium the only login option.
      - ENABLE_LOGIN_FORM=false
      # Skip Open WebUI's "Continue with Pomerium" button and start the OIDC login
      # automatically. Pomerium already signed the user in, so there is no second prompt.
      - OAUTH_AUTO_REDIRECT=true
      # The first provisioned user becomes admin; later users default to "pending" and
      # must be approved. Uncomment to make new SSO users active immediately instead.
      # - DEFAULT_USER_ROLE=user
    volumes:
      - open-webui-data:/app/backend/data
    # Open WebUI is only on the internal network, so Pomerium is the only way in.
    networks:
      internal: {}
    restart: always

volumes:
  pomerium-cache:
  open-webui-data:

networks:
  default: {}
  # internal: true has no route to the host or outside world; only services attached
  # to it (Pomerium and Open WebUI) can talk on it.
  internal:
    internal: true
