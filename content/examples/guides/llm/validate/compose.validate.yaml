# Sealed E2E validation for the Open WebUI (LLM) guide. Reuses the shared harness
# (Keycloak + certs + headless runner) and adds Open WebUI + a Pomerium wired to the
# in-network IdP. Open WebUI logs in through Pomerium's OIDC bridge.
# Run with: scripts/validate-guide-fixtures.sh llm

include:
  - ../../_harness/compose/compose.harness.yaml

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:7f1b0a1a50cfbac23da3b16f96bc968fd757b26dc9e54e93813d61768ea9184e
    environment:
      WEBUI_URL: https://llm.localhost.pomerium.io
      OAUTH_PROVIDER_NAME: Pomerium
      OAUTH_CLIENT_ID: https://llm.localhost.pomerium.io
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OAUTH_TOKEN_ENDPOINT_AUTH_METHOD: client_secret_post
      # TODO: restore "openid email profile" (as in the guide) once the released
      # bridge accepts multiple scopes. The v0.35.0 pre-release build rejects them.
      OAUTH_SCOPES: openid
      OPENID_PROVIDER_URL: https://authenticate.localhost.pomerium.io/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://llm.localhost.pomerium.io/oauth/oidc/callback
      ENABLE_OAUTH_SIGNUP: 'true'
      ENABLE_LOGIN_FORM: 'false'
      OAUTH_AUTO_REDIRECT: 'true'
      # No external model backend in the sealed fixture; the identity flow is what we
      # assert. Offline mode keeps startup from reaching out to the network.
      HF_HUB_OFFLINE: '1'
      WEBUI_SECRET_KEY: pomerium-e2e-test-key
      # Trust the harness CA so Open WebUI can call Pomerium's OIDC endpoints over TLS.
      # Validation-only; the published guide uses a public certificate.
      SSL_CERT_FILE: /certs/ca.crt
      REQUESTS_CA_BUNDLE: /certs/ca.crt
    volumes:
      - certs:/certs:ro
    # Open WebUI lives ONLY on the internal network it shares with Pomerium. It is not
    # on `default`, so the test-runner cannot reach :8080 directly (proven in
    # assert.spec.ts). Pomerium's alias on that network lets Open WebUI reach the
    # authenticate service for the OIDC discovery and token calls.
    networks:
      internal:
        aliases:
          - open-webui
    healthcheck:
      test: ['CMD-SHELL', 'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/health'')"']
      interval: 10s
      timeout: 5s
      retries: 30
      # Open WebUI is a large image and does a slow first-boot migration; give it room.
      start_period: 180s

  pomerium:
    # TODO: switch to the pomerium/pomerium v0.35.0 release image (pinned by digest)
    # once it ships. Until then this uses the unreleased OIDC bridge build from
    # gcp-demo: docker load < pomerium-oidc-bridge-7f192990.image.tar.gz
    image: local/pomerium:oidc-bridge-7f192990
    command: ['--config', '/pomerium/config.yaml']
    env_file:
      - ../../_harness/pomerium/validation.env
    volumes:
      - certs:/certs:ro
      - ./routes.validate.yaml:/pomerium/config.yaml:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      open-webui:
        condition: service_healthy
    # Pomerium straddles both networks: `default` so the runner and Keycloak can reach
    # it, `internal` so it alone can route to Open WebUI.
    networks:
      default:
        aliases:
          - authenticate.localhost.pomerium.io
          - llm.localhost.pomerium.io
      internal:
        aliases:
          - authenticate.localhost.pomerium.io
    healthcheck:
      test: ['CMD', 'pomerium', 'health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  # internal: true means no gateway to the host/outside; only services explicitly
  # attached (open-webui + pomerium) can talk on it, and nothing on `default` (the
  # test-runner) can reach open-webui directly.
  internal:
    internal: true
