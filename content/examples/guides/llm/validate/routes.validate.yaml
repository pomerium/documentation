# Routes-only validation config. Shared settings (IdP, secrets, certs) come from
# ../../_harness/pomerium/validation.env via env_file in compose.validate.yaml.
routes:
  # Mirrors the two routes in ../config.yaml.
  - from: https://llm.localhost.pomerium.io
    prefix: /_app/immutable/
    to: http://open-webui:8080
    set_response_headers:
      Cache-Control: private, max-age=31536000, immutable
    policy:
      - allow:
          or:
            - email:
                ends_with: '@company.com'

  - from: https://llm.localhost.pomerium.io
    to: http://open-webui:8080
    oidc_bridge: {}
    allow_websockets: true
    set_response_headers:
      Cache-Control: no-cache
    # Allows company.com (alice, charlie) so the spec can check both the first
    # user's admin role and the pending role for later users; bob@example.com stays
    # outside it.
    policy:
      - allow:
          or:
            - email:
                ends_with: '@company.com'
