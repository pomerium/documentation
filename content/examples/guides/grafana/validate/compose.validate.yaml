# Sealed E2E validation for the Grafana guide. Reuses the shared harness (Keycloak +
# certs + headless runner) and adds Grafana + a Pomerium wired to the in-network IdP.
# Run with: scripts/validate-guide-fixtures.sh grafana

include:
  - ../../_harness/compose/compose.harness.yaml

services:
  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    environment:
      GF_SERVER_ROOT_URL: https://grafana.localhost.pomerium.io/
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_NAME: Pomerium
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: https://grafana.localhost.pomerium.io
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
      # TODO: restore "openid email profile" (as in the guide) once the released
      # bridge accepts multiple scopes. The v0.35.0 pre-release build rejects them.
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://authenticate.localhost.pomerium.io/oidc/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://authenticate.localhost.pomerium.io/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://authenticate.localhost.pomerium.io/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: 'true'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://grafana.localhost.pomerium.io/.pomerium/sign_out
      # Trust the harness CA so Grafana can call Pomerium's OIDC endpoints over TLS.
      # Validation-only; the published guide uses the public hosted authenticate cert.
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - certs:/certs:ro
    networks:
      default:
        aliases:
          - grafana

  pomerium:
    # TODO: switch to the pomerium/pomerium v0.35.0 release image (pinned by digest)
    # once it ships. Until then this uses the unreleased OIDC bridge build from
    # gcp-demo: docker load < pomerium-oidc-bridge-7f192990.image.tar.gz
    image: local/pomerium:oidc-bridge-7f192990
    command: ['--config', '/pomerium/config.yaml']
    env_file:
      - ../../_harness/pomerium/validation.env
    volumes:
      - certs:/certs:ro
      - ./routes.validate.yaml:/pomerium/config.yaml:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      grafana:
        condition: service_started
    networks:
      default:
        aliases:
          - authenticate.localhost.pomerium.io
          - grafana.localhost.pomerium.io
    healthcheck:
      test: ['CMD', 'pomerium', 'health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
