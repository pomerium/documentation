services:
  pomerium:
    image: pomerium/pomerium:main@sha256:07574b2040dac563f729198f19080492b14d9eaa2424f5719863505fe4999ea7
    volumes:
      - ./config.yaml:/pomerium/config.yaml:ro
      - pomerium-cache:/data
    ports:
      - 443:443
      - 80:80
    networks:
      default: {}
      gitea-internal:
        ipv4_address: 172.31.0.2
    restart: always

  gitea:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    # Reverse-proxy auth trusts the identity header from ANY peer that can reach
    # gitea:3000, and REVERSE_PROXY_TRUSTED_PROXIES does NOT change that (it only
    # affects X-Forwarded-For parsing). Network isolation is the trust boundary:
    # gitea sits on an internal-only network with Pomerium and nothing else.
    networks:
      gitea-internal: {}
    volumes:
      - gitea-data:/data
    environment:
      GITEA__server__ROOT_URL: 'https://gitea.yourdomain.com/'
      GITEA__database__DB_TYPE: 'sqlite3'
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__REQUIRE_SIGNIN_VIEW: 'true'

      # Reverse-proxy SSO: Gitea trusts the identity header Pomerium forwards.
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: 'true'
      # Web UI sign-in only. Keep header auth off the API so tokens/SSH stay the
      # path for Git and API clients (set explicitly, not relying on the default).
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API: 'false'
      GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: 'true'
      GITEA__service__ENABLE_REVERSE_PROXY_EMAIL: 'true'
      GITEA__service__ENABLE_REVERSE_PROXY_FULL_NAME: 'true'
      # Allow provisioning via the proxy, but keep the local sign-up form closed.
      GITEA__service__DISABLE_REGISTRATION: 'false'
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: 'true'
      GITEA__service__SHOW_REGISTRATION_BUTTON: 'false'

      # Header names must match what Pomerium sends (config.yaml above).
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER: 'X-Pomerium-Sub'
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_EMAIL: 'X-Pomerium-Claim-Email'
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_FULL_NAME: 'X-Pomerium-Claim-Name'
      # Sign out sends users to Pomerium's sign-out endpoint, so the next request
      # doesn't sign them straight back in with the forwarded headers.
      GITEA__security__REVERSE_PROXY_LOGOUT_REDIRECT: 'https://gitea.yourdomain.com/.pomerium/sign_out'
      # For X-Forwarded-For client-IP parsing, list only Pomerium. This does not
      # restrict which peer the reverse-proxy auth header is trusted from. Must
      # be an IP/CIDR, not a hostname; the Compose network gives Pomerium a
      # fixed address.
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: '172.31.0.2/32'
      GITEA__security__REVERSE_PROXY_LIMIT: '1'
    restart: always

networks:
  # internal: true keeps Gitea off the host and reachable only by Pomerium, which
  # the reverse-proxy-auth trust model requires. The fixed subnet gives Pomerium a
  # stable address for REVERSE_PROXY_TRUSTED_PROXIES.
  # The fixed name keeps the network inspect command in the guide working.
  # ip_range keeps Docker's automatic addresses away from Pomerium's 172.31.0.2,
  # so Gitea can't take it if it starts first.
  gitea-internal:
    name: gitea-pomerium
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
          ip_range: 172.31.0.128/25

volumes:
  pomerium-cache:
  gitea-data:
