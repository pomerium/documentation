# Pomerium Core configuration for Gitea. Uses the hosted authenticate service, so
# you don't run your own identity provider. To self-host the IdP, see the Keycloak
# guide: https://www.pomerium.com/docs/integrations/user-identity/oidc
authenticate_service_url: https://authenticate.pomerium.app

# Obtain TLS certificates automatically from Let's Encrypt.
autocert: true

# Encrypts Pomerium's session cookies. Keep the same value across restarts, or
# every user has to sign in again after Pomerium restarts:
#   openssl rand -base64 32
cookie_secret: REPLACE_WITH_BASE64_32_BYTE_COOKIE_SECRET

# Forward the user's identity claims to Gitea as request headers. Gitea usernames
# cannot contain every character that is valid in an email address, so this uses
# the stable OIDC sub claim for the username and carries the real address in
# X-Pomerium-Claim-Email.
jwt_claims_headers:
  X-Pomerium-Sub: sub
  X-Pomerium-Claim-Email: email
  X-Pomerium-Claim-Name: name

routes:
  - from: https://gitea.yourdomain.com
    to: http://gitea:3000
    pass_identity_headers: true
    # Gitea compares the request's Host header with ROOT_URL. Without this, it
    # sees http://gitea:3000 and warns administrators that ROOT_URL doesn't match.
    preserve_host_header: true
    # Git transfers can be large and long-running; don't cap total request time.
    timeout: 0s
    idle_timeout: 600s
    policy:
      - allow:
          or:
            - email:
                # Replace with the users or domain you want to allow
                is: you@example.com
